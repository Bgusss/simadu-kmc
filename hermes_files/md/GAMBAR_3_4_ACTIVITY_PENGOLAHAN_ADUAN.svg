<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1950 800" role="img" aria-labelledby="title desc">
  <title id="title">Activity Diagram Pengolahan Aduan dari Media Sosial</title>
  <desc id="desc">Alur pengolahan aduan dari sinkronisasi, penyimpanan mention, pemeriksaan spam, penyimpanan notifikasi, klasifikasi, pemeriksaan duplikasi, hingga pembuatan tiket.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#000"/></marker>
  </defs>
  <rect width="1950" height="800" fill="#fff"/>
  <rect x="15" y="15" width="1920" height="770" fill="none" stroke="#000" stroke-width="1.5"/>

  <!-- Alur utama -->
  <g fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M130 235 H180"/>
    <path d="M370 235 H420"/>
    <path d="M610 235 H675"/>
    <path d="M805 235 H855"/>
    <path d="M1015 235 H1065"/>
    <path d="M1225 235 H1280"/>
    <path d="M1420 235 H1470"/>
    <path d="M1650 235 H1710"/>

    <!-- Jalur spam -->
    <path d="M740 300 V420"/>
    <path d="M740 500 V610"/>

    <!-- Jalur kemungkinan duplikasi -->
    <path d="M1350 300 V365 H1120 V420"/>
    <path d="M1230 475 H1365"/>
    <path d="M1430 410 V330 H1560 V280"/>
    <path d="M1545 475 H1600"/>
    <path d="M1680 530 V610"/>
  </g>

  <!-- Mulai dan alur utama -->
  <ellipse cx="75" cy="235" rx="55" ry="28" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="75" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">Mulai</text>

  <rect x="180" y="190" width="190" height="90" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="275" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Sinkronisasi Aduan</text>
  <text x="275" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Facebook dan Instagram</text>

  <rect x="420" y="190" width="190" height="90" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="515" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Simpan Data</text>
  <text x="515" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Mention</text>

  <polygon points="740,170 805,235 740,300 675,235" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="740" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">Pesan spam?</text>
  <text x="832" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">Tidak</text>
  <text x="760" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">Ya</text>

  <rect x="855" y="190" width="160" height="90" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="935" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Simpan</text>
  <text x="935" y="249" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Notifikasi</text>

  <rect x="1065" y="190" width="160" height="90" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="1145" y="219" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Klasifikasi AI</text>
  <text x="1145" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">Kategori, OPD, Prioritas</text>

  <polygon points="1350,170 1420,235 1350,300 1280,235" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="1350" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">Kemungkinan</text>
  <text x="1350" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">duplikasi?</text>
  <text x="1450" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">Tidak</text>
  <text x="1370" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">Ya</text>

  <rect x="1470" y="190" width="180" height="90" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="1560" y="219" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Buat Tiket</text>
  <text x="1560" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">Nomor lacak, OPD, SLA</text>

  <ellipse cx="1765" cy="235" rx="55" ry="28" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="1765" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">Selesai</text>

  <!-- Jalur spam: hanya mention tersimpan, notifikasi dan tiket tidak dibuat -->
  <rect x="645" y="420" width="190" height="80" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="740" y="451" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Pesan Tidak Diproses</text>
  <text x="740" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Notifikasi dan tiket tidak dibuat</text>
  <ellipse cx="740" cy="650" rx="55" ry="28" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="740" y="656" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">Selesai</text>

  <!-- Jalur verifikasi duplikasi -->
  <rect x="1020" y="420" width="210" height="110" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="1125" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Tandai Kandidat</text>
  <text x="1125" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Duplikasi</text>
  <text x="1125" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Menunggu verifikasi Admin KMC</text>

  <polygon points="1430,410 1495,475 1430,540 1365,475" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="1430" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">Dikonfirmasi</text>
  <text x="1430" y="488" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">duplikat?</text>
  <text x="1498" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">Tidak</text>
  <text x="1575" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">Ya</text>

  <rect x="1600" y="420" width="160" height="110" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="1680" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Konfirmasi</text>
  <text x="1680" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Duplikat</text>
  <text x="1680" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Tiket tidak dibuat</text>
  <ellipse cx="1680" cy="650" rx="55" ry="28" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="1680" y="656" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">Selesai</text>

  <text x="1560" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic">Tiket diteruskan ke OPD tujuan</text>
  <text x="1040" y="725" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic">Kandidat duplikasi hanya dibuatkan tiket jika Admin KMC menyatakan bukan duplikasi.</text>
</svg>
