<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 220" style="background: white;">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="black" />
    </marker>
  </defs>

  <!-- Border -->
  <rect x="10" y="10" width="1080" height="200" fill="none" stroke="black" stroke-width="1.5"/>

  <!-- START -->
  <ellipse cx="80" cy="90" rx="55" ry="28" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="80" y="95" font-family="Arial" font-size="13" text-anchor="middle" fill="black">mulai</text>

  <!-- Arrow 1 -->
  <line x1="135" y1="90" x2="178" y2="90" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- REQUIREMENT -->
  <rect x="180" y="55" width="150" height="70" rx="8" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="255" y="82" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="black">Requirement</text>
  <text x="255" y="100" font-family="Arial" font-size="11" text-anchor="middle" fill="black">(Analisis</text>
  <text x="255" y="115" font-family="Arial" font-size="11" text-anchor="middle" fill="black">Kebutuhan)</text>

  <!-- Arrow 2 -->
  <line x1="330" y1="90" x2="373" y2="90" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DESIGN -->
  <rect x="375" y="55" width="150" height="70" rx="8" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="450" y="87" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="black">Design</text>
  <text x="450" y="107" font-family="Arial" font-size="11" text-anchor="middle" fill="black">(Perancangan)</text>

  <!-- Arrow 3 -->
  <line x1="525" y1="90" x2="568" y2="90" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DEVELOPMENT -->
  <rect x="570" y="55" width="150" height="70" rx="8" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="645" y="82" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="black">Development</text>
  <text x="645" y="100" font-family="Arial" font-size="11" text-anchor="middle" fill="black">(Pengembangan)</text>

  <!-- Arrow 4 -->
  <line x1="720" y1="90" x2="763" y2="90" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- TESTING -->
  <rect x="765" y="55" width="150" height="70" rx="8" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="840" y="87" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="black">Testing</text>
  <text x="840" y="107" font-family="Arial" font-size="11" text-anchor="middle" fill="black">(Pengujian)</text>

  <!-- Arrow 5 -->
  <line x1="915" y1="90" x2="958" y2="90" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- END -->
  <ellipse cx="1010" cy="90" rx="55" ry="28" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="1010" y="95" font-family="Arial" font-size="13" text-anchor="middle" fill="black">selesai</text>

  <!-- Iteration loop (bawah) -->
  <path d="M 840 125 L 840 160 L 645 160 L 645 125" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="742" y="178" font-family="Arial" font-size="11" font-style="italic" text-anchor="middle" fill="black">iterasi jika diperlukan</text>

</svg>