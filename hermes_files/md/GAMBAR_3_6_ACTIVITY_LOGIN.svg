<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
  <title id="title">Activity Diagram Login dan Logout</title>
  <desc id="desc">Alur proses masuknya pengguna (Admin/OPD) ke dalam sistem dan proses keluar.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#000"/></marker>
  </defs>
  <rect width="1000" height="800" fill="#fff"/>
  <rect x="15" y="15" width="970" height="770" fill="none" stroke="#000" stroke-width="1.5"/>

  <g fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M125 150 H180"/>
    <path d="M370 150 H430"/>
    <path d="M620 150 H680"/>
    <path d="M740 150 H800"/>
    <path d="M890 220 V280"/>
    
    <!-- Role Admin -->
    <path d="M960 150 H975 V380 H800 V430"/>
    
    <!-- Role OPD -->
    <path d="M890 180 V430"/>

    <path d="M890 490 V550"/>
    <path d="M890 610 V670"/>

    <!-- Kredensial tidak valid -->
    <path d="M710 120 V80 H275 V120"/>
  </g>

  <!-- Mulai -->
  <ellipse cx="70" cy="150" rx="55" ry="28" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="70" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">Mulai</text>

  <!-- Mengakses Halaman Login -->
  <rect x="180" y="120" width="190" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="275" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Mengakses Login</text>

  <!-- Masukkan kredensial -->
  <rect x="430" y="120" width="190" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="525" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Memasukkan Email</text>
  <text x="525" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">dan Kata Sandi</text>

  <!-- Validasi -->
  <polygon points="710,120 740,150 710,180 680,150" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="710" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Kredensial</text>
  <text x="710" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">valid?</text>
  <text x="765" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">Ya</text>
  <text x="685" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">Tidak</text>

  <!-- Pengecekan Role -->
  <polygon points="890,120 960,150 890,180 820,150" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="890" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">Peran</text>
  <text x="890" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">(Role)?</text>
  <text x="960" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">Admin</text>
  <text x="915" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">OPD</text>

  <!-- Dashboard Admin -->
  <rect x="710" y="430" width="160" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="790" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Dashboard Admin</text>

  <!-- Dashboard OPD -->
  <rect x="800" y="280" width="180" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="890" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Dashboard OPD</text>

  <!-- Merge Flow -->
  <g fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M790 490 V520 H890"/>
    <path d="M890 340 V490"/>
  </g>

  <!-- Logout -->
  <rect x="795" y="550" width="190" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="890" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Menekan Logout</text>

  <!-- Selesai -->
  <ellipse cx="890" cy="700" rx="55" ry="28" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="890" y="706" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">Selesai</text>

</svg>
