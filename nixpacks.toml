[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "nodejs_22"]

[phases.install]
cmds = [
  "composer install --optimize-autoloader --no-dev --no-interaction",
  "npm ci --include=dev"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "mkdir -p storage/app/public/profiles storage/app/public/attachments storage/framework/{cache/data,sessions,views} storage/logs && rm -rf public/storage 2>/dev/null; php artisan migrate --force && php artisan storage:seed && php artisan config:cache && php artisan route:cache && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
