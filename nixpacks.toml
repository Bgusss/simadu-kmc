[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "nodejs_22"]

[phases.install]
cmds = [
  "composer install --optimize-autoloader --no-dev --no-interaction",
  "npm ci --include=dev"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "mkdir -p storage/app/public/profiles storage/app/public/attachments storage/app/public/complaints storage/framework/{cache/data,sessions,views} storage/logs && rm -rf public/storage 2>/dev/null; php artisan migrate --force && php artisan storage:seed && echo 'FILES AFTER SEED:' && ls -la storage/app/public/profiles/ && ls -la storage/app/public/attachments/ && php artisan cleanup:last-notifications 15 && php artisan config:cache && php artisan route:cache && mkdir -p /tmp/phpini && cp $(php -r 'echo php_ini_loaded_file();') /tmp/phpini/php.ini 2>/dev/null; cat /app/php.ini >> /tmp/phpini/php.ini && echo 'PHP INI:' && php -c /tmp/phpini/php.ini -r 'echo \"post_max_size=\" . ini_get(\"post_max_size\") . \" upload_max_filesize=\" . ini_get(\"upload_max_filesize\");' && echo '' && php -c /tmp/phpini/php.ini artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
