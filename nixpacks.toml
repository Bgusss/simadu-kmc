nixpacks.providers = ["php", "node"]

[phases.setup]
nixPkgs = ["php83", "php83Extensions.pdo", "php83Extensions.pdo_mysql", "php83Extensions.mbstring", "php83Extensions.gd", "php83Extensions.zip", "nodejs_20"]

[phases.install]
cmds = [
  "composer install --optimize-autoloader --no-dev",
  "npm ci"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
