[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "nodejs_20"]
aptPkgs = ["php83-pdo", "php83-pdo_mysql", "php83-mbstring", "php83-gd", "php83-zip", "php83-xml", "php83-curl"]

[phases.install]
cmds = [
  "composer install --optimize-autoloader --no-dev --no-interaction",
  "npm ci --include=dev"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
